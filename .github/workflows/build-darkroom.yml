name: Build Darkroom APK

on:
  workflow_dispatch: # เปิดให้กดสั่งบิลด์ผ่านมือถือได้เองทุกเมื่อ

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c # หรือเวอร์ชัน NDK 29

      - name: Install Rust Toolchain & Target
        run: |
          rustup default 1.85.0
          rustup target add aarch64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked

      - name: Grant Execute Permission for Gradlew
        working-directory: apps/lightcraft-android/android
        run: chmod +x gradlew

      - name: Build Release APK (64-bit ARM)
        working-directory: apps/lightcraft-android/android
        run: |
          ./gradlew assembleRelease -Plightcraft.abis=arm64-v8a -Plightcraft.unsigned=true

      - name: Upload Darkroom APK
        uses: actions/upload-artifact@v4
        with:
          name: Darkroom-Release-APK
          path: apps/lightcraft-android/android/app/build/outputs/apk/release/*.apk
